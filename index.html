.card .phones a {

.card .phones a:hover { text-decoration: underline; }

function render(items) {
  const container = document.getElementById('listContainer');
  const noResults = document.getElementById('noResults');
  container.innerHTML = '';
  if (items.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';
  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = data.indexOf(item) + 1;
    card.appendChild(num);
    const info = document.createElement('div');
    info.className = 'info';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = item.name;
    info.appendChild(nameSpan);
    card.appendChild(info);
    const actions = document.createElement('div');
    actions.className = 'actions';
    const mapLink = document.createElement('a');
    mapLink.className = 'map-btn' + (item.map ? ' verified' : '');
    mapLink.href = item.map || mapsUrl(item.name);
    mapLink.target = '_blank';
    mapLink.rel = 'noopener';
    mapLink.textContent = item.map ? '📍 موقع مؤكد' : '🗺️ بحث في الخريطة';
    actions.appendChild(mapLink);
    if (item.phones.length > 0) {
      const phonesDiv = document.createElement('div');
      phonesDiv.className = 'phones';
      item.phones.forEach((p, i) => {
        const a = document.createElement('a');
        a.href = 'tel:' + p;
        a.textContent = p;
        phonesDiv.appendChild(a);
        if (i < item.phones.length - 1) {
          phonesDiv.appendChild(document.createTextNode(' - '));
        }
      });
      actions.appendChild(phonesDiv);
    }
    card.appendChild(actions);
    container.appendChild(card);
  });
}

render(data);

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { render(data); return; }
  const filtered = data.filter(item => {
    if (item.name.toLowerCase().includes(q)) return true;
    for (const p of item.phones) {
      if (p.includes(q)) return true;
    }
    return false;
  });
  render(filtered);
});
